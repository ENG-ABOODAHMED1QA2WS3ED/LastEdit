<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self';">
  <title>المطابقة الذكية - أبو كميل POS</title>
  <link rel="stylesheet" href="../styles/matching.css">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h2>أبو كميل POS</h2>
    <span class="version">v6.0</span>
  </div>
  <nav class="sidebar-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon"></span><span>الرئيسية</span></a>
    <a href="invoice.html" class="nav-item"><span class="nav-icon"></span><span>فاتورة جديدة</span></a>
    <a href="customers.html" class="nav-item"><span class="nav-icon"></span><span>الزبائن</span></a>
    <a href="products.html" class="nav-item"><span class="nav-icon"></span><span>المنتجات</span></a>
    <a href="debts.html" class="nav-item"><span class="nav-icon"></span><span>الأرصدة والديون</span></a>
    <a href="matching.html" class="nav-item active"><span class="nav-icon"></span><span>المطابقة الذكية</span></a>
    <a href="statement.html" class="nav-item"><span class="nav-icon"></span><span>كشف حساب</span></a>
    <a href="reports.html" class="nav-item"><span class="nav-icon"></span><span>التقارير</span></a>
    <a href="settings.html" class="nav-item"><span class="nav-icon"></span><span>الإعدادات</span></a>
  </nav>
  <div class="sidebar-footer">
    <div class="user-info"><span id="currentUser">المدير</span></div>
    <button id="btnLogout" class="btn-logout"> تسجيل خروج</button>
  </div>
</aside>

<main class="main-content">
  <header class="page-header">
    <div class="header-info">
      <h1> المطابقة الذكية</h1>
      <p>مطابقة تلقائية بالتقييم مع تعلم الأسماء</p>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" data-action="uploadFile"> رفع كشف بنك (CSV)</button>
      <button class="btn btn-secondary" data-action="showStats"> إحصائيات</button>
      <button class="btn btn-danger" id="btnClearOldBank" title="مسح جميع الكشوفات البنكية القديمة"> مسح الكشوفات</button>
    </div>
  </header>

  <!-- نتائج الاستيراد -->
  <div id="importResults" class="section-card" style="display:none;"></div>

  <!-- نتائج المطابقة -->
  <div id="matchingResults" class="section-card" style="display:none;"></div>

  <!-- حالة فارغة -->
  <div id="emptyState" class="empty-state">
    <div class="empty-icon"></div>
    <h3>لا توجد نتائج بعد</h3>
    <p>ارفع كشف البنك (CSV) وسيقوم النظام بالمطابقة التلقائية</p>
  </div>

  <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" style="display:none;">
</main>

<script src="../scripts/matching.js"></script>

</body>
</html>
